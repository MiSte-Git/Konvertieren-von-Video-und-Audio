# Baut die Installer fuer Windows, macOS und Linux.
#  - Tag v* pushen (z.B. v0.2.0): baut alles und legt ein Release-Entwurf an
#  - manuell (Actions > Release > Run workflow): baut nur, Installer als Artefakte
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            label: windows-x64
            args: --config src-tauri/ci/windows.json
          - name: macOS Apple Silicon
            platform: macos-latest
            label: macos-arm64
            args: --config src-tauri/ci/macos.json
          - name: macOS Intel
            platform: macos-15-intel
            label: macos-x64
            args: --config src-tauri/ci/macos.json
          - name: Linux x64
            platform: ubuntu-22.04
            label: linux-x64
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v6

      - name: Version pruefen (Tag muss zu Cargo.toml passen)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(grep -m1 '^version' tauri-app/src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version $v in tauri-app/src-tauri/Cargo.toml"
            exit 1
          fi

      - name: Linux-Abhaengigkeiten
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev xdg-utils rpm

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'tauri-app/src-tauri -> target'

      # ---------- ffmpeg/lame mitliefern (Windows) ----------
      - name: ffmpeg holen (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dst = "bin/windows"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Invoke-WebRequest "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $root = (Get-ChildItem ffmpeg-tmp -Directory | Select-Object -First 1).FullName
          Copy-Item "$root/bin/ffmpeg.exe", "$root/bin/ffprobe.exe" $dst
          if (Test-Path "$root/LICENSE.txt") { Copy-Item "$root/LICENSE.txt" "$dst/LICENSE-ffmpeg.txt" }
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg-tmp

      - name: MSYS2 fuer lame (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-lame

      - name: lame holen (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          dst=bin/windows
          cp /mingw64/bin/lame.exe "$dst/"
          for dll in $(ldd /mingw64/bin/lame.exe | awk '/\/mingw64\//{print $3}'); do
            cp "$dll" "$dst/"
          done
          cp /mingw64/share/licenses/lame/COPYING "$dst/LICENSE-lame.txt" 2>/dev/null || true
          ls -la "$dst"
          "$dst/lame.exe" --version | head -n 1
          "$dst/ffmpeg.exe" -hide_banner -version | head -n 1

      # ---------- ffmpeg/lame mitliefern (macOS) ----------
      - name: ffmpeg und lame holen (macOS)
        if: runner.os == 'macOS'
        run: bash scripts/ci/fetch-binaries-macos.sh

      # ---------- Bauen und Release ----------
      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri-app
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Konvertierung Audio-Video ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          releaseBody: |
            ## Installation

            **Windows:** `*_x64-setup.exe` ausfuehren (oder `.msi`). ffmpeg und lame sind enthalten.
            Da der Installer nicht signiert ist, zeigt Windows SmartScreen eine Warnung: *Weitere Informationen* > *Trotzdem ausfuehren*.

            **macOS:** `.dmg` oeffnen und die App nach *Programme* ziehen (`aarch64` = Apple Silicon, `x64` = Intel). ffmpeg und lame sind enthalten.
            Die App ist nicht notarisiert: beim ersten Start Rechtsklick > *Oeffnen*, oder unter *Systemeinstellungen > Datenschutz & Sicherheit* freigeben.
            Falls macOS meldet, die App sei beschaedigt: `xattr -cr "/Applications/Konvertierung Audio-Video.app"`

            **Linux:** `.deb` (Debian/Ubuntu) oder `.rpm` (Fedora/openSUSE) installieren, ffmpeg und lame werden als Abhaengigkeit mitinstalliert.
            Das `.AppImage` braucht ffmpeg und lame vom System (`sudo apt install ffmpeg lame`).

      - name: Installer als Artefakt hochladen (manueller Lauf)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v6
        with:
          name: Konvertierung-Audio-Video_${{ steps.tauri.outputs.appVersion }}_${{ matrix.label }}
          path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), fromJSON('"\n"')) }}
          if-no-files-found: error
